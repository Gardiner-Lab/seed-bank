<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seed Bank</title>
    <link rel="icon" type="image/svg+xml" href="{{ request.script_root }}/static/trellis/seeds.svg">
    <link rel="stylesheet" href="{{ request.script_root }}/static/trellis/trellis.css?v={{ version }}">
    <link rel="stylesheet" href="{{ request.script_root }}/static/css/seeds.css?v={{ version }}">
    <!-- three.js (MIT), kept in this repository, for the 3D viewer. -->
    <script type="importmap">
        {"imports": {"three": "{{ request.script_root }}/static/vendor/three/three.module.min.js",
                     "three/addons/": "{{ request.script_root }}/static/vendor/three/addons/"}}
    </script>
</head>
<body class="tt">
<header class="tt-bar">
    <a class="tt-home" href="{{ links.suite_home }}" title="All of Trellis Tools"><img src="{{ request.script_root }}/static/trellis/trellis.svg" alt=""><span>Trellis Tools</span></a>
    <a class="tt-module" href="{{ request.script_root }}/"><img src="{{ request.script_root }}/static/trellis/seeds.svg" alt="">Seed Bank</a>
    <nav class="tt-tabs view-tabs">
        <a class="tt-tab view-tab" data-view="lines" href="#lines">Lines</a>
        <a class="tt-tab view-tab" data-view="lots" href="#lots">Seed lots</a>
        <a class="tt-tab view-tab" data-view="plants" href="#plants">Plants</a>
    </nav>
    <nav class="tt-links">
        <a href="{{ links.notebook }}/" target="_blank" rel="noopener">Notebook ↗</a>
        <a href="{{ links.editor }}/editor" target="_blank" rel="noopener">Plasmid Editor ↗</a>
        <a href="{{ request.script_root }}/about">About</a>
    </nav>
    <a class="tt-help" href="{{ request.script_root }}/help" title="How to enter seeds, plants and lines">Help</a>
    <span class="tt-user">{{ person.username }}{% if person.lab %} · {{ person.lab }}{% endif %}{% if person.role == 'admin' %} · admin{% endif %}</span>
    <a class="tt-logout" href="{{ links.logout }}">Log out</a>
</header>
<main class="main" id="main"></main>
<div id="toasts" class="toasts"></div>
<script>
    window.SB = {
        base: {{ request.script_root | tojson }},
        editor: {{ links.editor | tojson }},
        notebook: {{ links.notebook | tojson }},
        stocks: {{ links.stocks | tojson }},
        person: {{ person.to_dict() | tojson }},
    };
</script>
<script src="{{ request.script_root }}/static/js/seeds.js?v={{ version }}"></script>
</body>
</html>
